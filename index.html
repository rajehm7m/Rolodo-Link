<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolod Link - منصة الروابط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0c0a15; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-bg { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <!-- صفحة التسجيل الأساسية -->
    <div id="auth-page" class="page max-w-md w-full glass p-8 rounded-3xl shadow-2xl">
        <h1 class="text-3xl font-bold mb-2 text-purple-400 text-center">Rolod Link</h1>
        <p class="text-gray-400 mb-6 text-sm text-center">أنشئ حسابك الخاص ببريدك وكلمة مرور مشفرة</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                <input type="email" id="auth-email" placeholder="name@example.com" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-purple-500 text-sm">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">كلمة المرور (مشفرة وآمنة)</label>
                <input type="password" id="auth-password" placeholder="••••••••" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-purple-500 text-sm">
            </div>
            <button onclick="requestVerification()" class="w-full gradient-bg py-3.5 rounded-xl font-bold hover:opacity-90 transition cursor-pointer shadow-lg mt-2">
                متابعة وإنشاء الحساب
            </button>
        </div>
    </div>

    <!-- نافذة التحقق عبر Gmail -->
    <div id="verify-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 max-w-sm w-full p-6 rounded-2xl text-center shadow-2xl">
            <div class="mb-4">
                <span class="text-2xl font-bold text-purple-400">تأكيد البريد الإلكتروني</span>
                <p id="verify-subtitle" class="text-xs text-gray-400 mt-2">تم إرسال رمز تحقق إلى بريدك.</p>
            </div>
            <div class="my-4">
                <input type="text" id="otp-code" maxlength="6" placeholder="1 2 3 4 5 6" class="w-full text-center tracking-widest text-xl p-3 rounded-xl bg-gray-800 border border-gray-700 outline-none focus:border-purple-500 font-mono">
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeVerifyModal()" class="w-1/2 bg-gray-800 py-2.5 rounded-xl text-sm font-semibold hover:bg-gray-700 cursor-pointer">إلغاء</button>
                <button onclick="confirmOtp()" class="w-1/2 bg-purple-600 py-2.5 rounded-xl text-sm font-semibold hover:bg-purple-500 cursor-pointer">تأكيد ودخول</button>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboard-page" class="page hidden max-w-2xl w-full glass p-8 rounded-3xl shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-purple-400">لوحة التحكم</h2>
            <button onclick="logout()" class="text-red-400 text-sm hover:underline cursor-pointer">تسجيل الخروج</button>
        </div>
        <div class="mb-6 p-4 bg-black/30 rounded-xl border border-purple-500/30">
            <p class="text-sm text-purple-300 mb-1">رابط صفحتك الخاص:</p>
            <div class="flex gap-2">
                <input type="text" value="rolod.link/user" class="w-full bg-transparent text-blue-400 outline-none font-mono text-sm" readonly>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs text-gray-400 mb-1">تيك توك</label><input type="text" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-purple-500 text-sm"></div>
            <div><label class="block text-xs text-gray-400 mb-1">انستغرام</label><input type="text" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-purple-500 text-sm"></div>
            <div><label class="block text-xs text-gray-400 mb-1">ديسكورد</label><input type="text" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-purple-500 text-sm"></div>
            <div><label class="block text-xs text-gray-400 mb-1">سناب شات</label><input type="text" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-purple-500 text-sm"></div>
        </div>
        <button onclick="alert('تم الحفظ!')" class="mt-6 w-full py-3 bg-purple-600 rounded-xl font-bold hover:bg-purple-500 transition cursor-pointer">حفظ التغييرات</button>
    </div>

    <script>
        let registeredEmails = ["test@example.com"];
        let currentEmail = "";
        let generatedOtp = "";

        async function requestVerification() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            if(!email || !password) { alert('الرجاء إدخال البيانات'); return; }

            try {
                const response = await fetch('http://localhost:3000/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: email })
                });
                const data = await response.json();
                if (data.success) {
                    currentEmail = email;
                    generatedOtp = data.code;
                    document.getElementById('verify-subtitle').innerText = `تم إرسال رمز التحقق إلى: ${email}`;
                    document.getElementById('verify-modal').classList.remove('hidden');
                } else {
                    alert('فشل الإرسال: ' + data.message);
                }
            } catch (error) { alert('تأكد أن السيرفر شغال!'); }
        }

        function closeVerifyModal() { document.getElementById('verify-modal').classList.add('hidden'); }
        function confirmOtp() {
            const otp = document.getElementById('otp-code').value;
            if(otp === generatedOtp) {
                document.getElementById('verify-modal').classList.add('hidden');
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('dashboard-page').classList.remove('hidden');
            } else {
                alert('الكود غير صحيح!');
            }
        }
        function logout() { location.reload(); }
    </script>
</body>
</html>
